<section>
    <div class="row-between">
        <h2>Pages</h2>
        <a href="{{app.admin_path}}/pages/new" class="btn btn-primary">+ New Page</a>
    </div>
    <table class="table">
        <thead><tr><th>ID</th><th>Title</th><th>Slug</th><th>Status</th><th></th></tr></thead>
        <tbody>
        {{#each pages}}
            <tr>
                <td>{{id}}</td>
                <td>{{title}}</td>
                <td>{{slug}}</td>
                <td>{{status}}</td>
                <td>
                    <a href="{{app.admin_path}}/pages/{{id}}/edit">edit</a>
                    <a href="{{app.admin_path}}/pages/{{id}}/delete" onclick="return confirm('Delete?')">delete</a>
                </td>
            </tr>
        {{/each}}
        </tbody>
    </table>
</section>
