<div class="auth-card">
    <h1>Login</h1>
    {{#if error}}<div class="error">{{error}}</div>{{/if}}
    <form method="POST" action="{{app.base_path}}/login">
        <label>Username
            <input type="text" name="username" required autofocus>
        </label>
        <label>Password
            <input type="password" name="password" required>
        </label>
        <button class="btn btn-primary" type="submit">Login</button>
    </form>
    <p class="muted">No account? <a href="{{app.base_path}}/register">Register</a></p>
</div>
